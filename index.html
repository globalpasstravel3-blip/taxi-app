<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5;}
.login-card{background:white;padding:20px;margin:50px auto;width:300px;text-align:center;border-radius:10px;}
button{padding:10px;background:#ffcc00;border:none;border-radius:5px;}
.main{display:none;}
</style>
</head>

<body>

<div id="loginBox">
  <div class="login-card">
    <h2>🚖 Goa Taxi Login</h2>
    <button onclick="login()">Enter App</button>
  </div>
</div>

<div id="app" class="main">
  <h2 style="padding:10px;">Taxi ERP</h2>

  <button onclick="load()">🔄 Refresh</button>

  <h3>Add Booking</h3>
  <input id="name" placeholder="Name"><br>
  <input id="phone" placeholder="Phone"><br>
  <input id="pickup" placeholder="Pickup"><br>
  <input id="drop" placeholder="Drop"><br>
  <input id="fare" placeholder="Fare"><br>

  <button onclick="save()">Save</button>

  <h3>Bookings</h3>
  <div id="list"></div>
</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwMBmG3ae8MRAR2jEXBaj-wnFljXFOFoYLftaSMQGlVtJ1CjdxVmn_-oMUSPpaOieSsPg/exec";

/* LOGIN BYPASS */
function login(){
  loginBox.style.display="none";
  app.style.display="block";
  load();
}

/* SAVE */
function save(){

  const data = {
    name: name.value,
    phone: phone.value,
    pickup: pickup.value,
    drop: drop.value,
    fare: fare.value
  };

  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"saveBooking",data:data})
  })
  .then(res=>res.text())
  .then(()=>{
    alert("Saved");
    load();
  });
}

/* LOAD */
function load(){

  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"getBookings"})
  })
  .then(res=>res.json())
  .then(list=>{
    let html="";
    list.forEach(i=>{
      html += `<div style="background:white;margin:5px;padding:10px;">
        <b>${i.name}</b> | ${i.pickup} | ₹${i.balance}
      </div>`;
    });
    listDiv = document.getElementById("list");
    listDiv.innerHTML = html;
  });
}

</script>

</body>
</html>
